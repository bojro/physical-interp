<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Physical Interp Labs logo">
  <!-- outer frame: a rounded square suggesting a physical system / chip -->
  <rect x="4" y="4" width="56" height="56" rx="12" fill="none" stroke="#1f4e79" stroke-width="3"/>
  <!-- internal circuit: nodes and edges -->
  <g stroke="#1f4e79" stroke-width="2.5" stroke-linecap="round">
    <line x1="18" y1="22" x2="32" y2="32"/>
    <line x1="46" y1="22" x2="32" y2="32"/>
    <line x1="32" y1="32" x2="32" y2="46"/>
    <line x1="18" y1="22" x2="46" y2="22"/>
  </g>
  <g fill="#1f4e79">
    <circle cx="18" cy="22" r="4"/>
    <circle cx="46" cy="22" r="4"/>
    <circle cx="32" cy="46" r="4"/>
  </g>
  <!-- the probed node: open circle, the one we look inside -->
  <circle cx="32" cy="32" r="5" fill="#ffffff" stroke="#1f4e79" stroke-width="2.5"/>
</svg>
